version: '3.8'

services:
  # Development app service
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: sunstore-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/vendor
    networks:
      sunstore-network:
        aliases:
          - app
    depends_on:
      - db
    profiles:
      - dev

  # Production app service
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: sunstore-app
    restart: unless-stopped
    working_dir: /app
    networks:
      sunstore-network:
        aliases:
          - app
    depends_on:
      - db
    profiles:
      - prod

  nginx:
    image: nginx:alpine
    container_name: sunstore-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sunstore-network
    profiles:
      - dev
      - prod

  db:
    image: postgres:16-alpine
    container_name: sunstore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunstore
      POSTGRES_USER: sunstore_user
      POSTGRES_PASSWORD: sunstore_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sunstore-network
    profiles:
      - dev
      - prod

networks:
  sunstore-network:
    driver: bridge

volumes:
  postgres-data:
